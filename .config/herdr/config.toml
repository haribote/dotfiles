onboarding = false

# prefix は herdr 既定の ctrl+b ではなく ctrl+a を使う（手に馴染んだ割当を維持）。
# キー操作は prefix に一本化し、ghostty の Cmd ブリッジ由来の ctrl+alt+<文字> は持たない。
# pane/tab/zoom/copy の各操作は herdr 既定キー（prefix+v/-/h j k l/z/[ 等）で運用する。
[keys]
prefix = "ctrl+a"

# tab レイアウトを崩さずに一時作業用の fish を開く。
[[keys.command]]
key = "prefix+space"
type = "popup"
description = "Scratch fish shell in a popup"
command = "fish"
width = "70%"
height = "60%"

[theme]
name = "catppuccin"
auto_switch = false

[theme.custom]
panel_bg    = "#1d262a"  # bg
surface_dim = "#1d262a"
surface0    = "#2a363b"  # FZF bg+
surface1    = "#435b67"  # border
overlay0    = "#4e6a78"  # selection
overlay1    = "#a1b0b8"  # dim
text        = "#e7ebed"  # fg
subtext0    = "#a1b0b8"  # dim
blue        = "#37b6ff"
green       = "#5cf19e"
yellow      = "#fed032"
red         = "#fc3841"
mauve       = "#fc669b"  # magenta
teal        = "#59ffd1"  # cyan
peach       = "#fc746d"
accent      = "#37b6ff"

[ui.toast]
delivery = "terminal"

[ui]
show_agent_labels_on_pane_borders = false
agent_panel_sort = "spaces"

[advanced]
scrollback_limit_bytes = 50000000

