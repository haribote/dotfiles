# Starship prompt — 2行構成・Nerd Font グリフ前提（UDEV Gothic NF）
# 配色は ghostty テーマ "Material Design Colors" に統一
#   青 #37b6ff / 緑 #5cf19e / 黄 #fed032 / 赤 #fc3841 / マゼンタ #fc669b / シアン #59ffd1
# 1行目: ディレクトリ / git / 言語バージョン など
# 2行目: 入力プロンプト記号

add_newline = true

format = """
$directory\
$git_branch\
$git_status\
$git_state\
$nodejs\
$python\
$rust\
$golang\
$cmd_duration\
$line_break\
$character"""

[character]
success_symbol = "[❯](bold #5cf19e)"
error_symbol = "[❯](bold #fc3841)"
vimcmd_symbol = "[❮](bold #fed032)"

[directory]
style = "bold #37b6ff"
truncation_length = 3
truncate_to_repo = true
read_only = " 󰌾"
format = "[$path]($style)[$read_only]($read_only_style) "

[git_branch]
symbol = " "
style = "bold #fc669b"
format = "[$symbol$branch]($style) "

[git_status]
style = "bold #fed032"
format = '([\[$all_status$ahead_behind\]]($style) )'
conflicted = "="
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
stashed = "*${count}"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

[cmd_duration]
min_time = 2_000
style = "bold #fed032"
format = "[ $duration]($style) "

[nodejs]
symbol = " "
format = "[$symbol($version )]($style)"

[python]
symbol = " "
format = '[$symbol($version )(\($virtualenv\) )]($style)'

[rust]
symbol = " "
format = "[$symbol($version )]($style)"

[golang]
symbol = " "
format = "[$symbol($version )]($style)"
