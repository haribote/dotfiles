# material.nvim の "Deep Ocean" スタイルのパレットに合わせる。
# HEX 値は material.nvim (marko-cerovac/material.nvim) の
# lua/material/colors/init.lua 内 `material_style == "deep ocean"` 分岐と同一。
base   = "ocean"
syntax = "base16-ocean.dark"

[ui]
toc_bg                      = "#1a1c25"  # 明るい bg
toc_border                  = "#232637"  # border
content_bg                  = "#0f111a"  # bg
scrollbar_hover             = "#84ffff"  # accent
status_bg                   = "#1a1c25"  # 明るい bg
status_separator            = "#464b5d"  # dim
status_brand_fg             = "#0f111a"  # bg
status_brand_bg             = "#84ffff"  # accent
status_filename_fg          = "#a6accd"  # fg
status_filename_bg          = "#1f2233"  # selection bg
status_watch_fg             = "#c3e88d"  # 緑
status_watch_bg             = "#1a1c25"  # 明るい bg
status_reloaded_fg          = "#0f111a"  # bg
status_reloaded_bg          = "#c3e88d"  # 緑
status_search_fg            = "#ffcb6b"  # 黄
status_search_bg            = "#1f2233"  # selection bg
status_success_fg           = "#c3e88d"  # 緑
status_success_bg           = "#1a1c25"  # 明るい bg
status_warning_fg           = "#ffcb6b"  # 黄
status_error_fg             = "#f07178"  # 赤
status_error_bg             = "#1a1c25"  # 明るい bg
status_shortcut_fg          = "#464b5d"  # dim
status_percent_fg           = "#84ffff"  # accent
toc_hover_fg                = "#a6accd"  # fg
toc_header_fg               = "#464b5d"  # dim
toc_active_bg               = "#1f2233"  # selection bg
toc_inactive_bg             = "#1a1c25"  # 明るい bg
toc_accent                  = "#c792ea"  # マゼンタ
toc_index_inactive          = "#232637"  # border
toc_primary_active          = "#a6accd"  # fg
toc_primary_inactive        = "#464b5d"  # dim
toc_secondary_inactive      = "#232637"  # border
toc_secondary_text_active   = "#a6accd"  # fg
toc_secondary_text_inactive = "#464b5d"  # dim

[markdown]
search_highlight_bg = "#1f2233"  # selection bg
search_match_bg     = "#ffcb6b"  # 黄
code_gutter         = "#232637"  # border
blockquote_marker   = "#464b5d"  # dim
list_level_1        = "#c3e88d"  # 緑
list_level_2        = "#84ffff"  # accent
list_level_3        = "#c792ea"  # マゼンタ
ordered_list        = "#ffcb6b"  # 黄
table_border        = "#232637"  # border
table_separator     = "#1f2233"  # selection bg
table_header        = "#84ffff"  # accent
table_cell          = "#a6accd"  # fg
heading_1           = "#84ffff"  # accent
heading_2           = "#c3e88d"  # 緑
heading_3           = "#89ddff"  # シアン
heading_4           = "#c792ea"  # マゼンタ
heading_other       = "#f78c6c"  # オレンジ
heading_underline   = "#232637"  # border
code_frame          = "#232637"  # border
code_label          = "#464b5d"  # dim
inline_code_fg      = "#89ddff"  # シアン
inline_code_bg      = "#1a1c25"  # 明るい bg
rule                = "#232637"  # border
link_icon           = "#84ffff"  # accent
link_text           = "#84ffff"  # accent
link_hover          = "#89ddff"  # シアン
blockquote_text     = "#464b5d"  # dim
text                = "#a6accd"  # fg
strong_text         = "#eeffff"  # 明るい fg
latex_inline_fg     = "#c792ea"  # マゼンタ
latex_inline_bg     = "#1a1c25"  # 明るい bg
latex_block_fg      = "#c792ea"  # マゼンタ
mermaid_keyword     = "#f78c6c"  # オレンジ
mermaid_arrow       = "#84ffff"  # accent
mermaid_label       = "#c3e88d"  # 緑
mermaid_block_fg    = "#a6accd"  # fg
mark_fg             = "#0f111a"  # bg
mark_bg             = "#ffcb6b"  # 黄
task_checked        = "#c3e88d"  # 緑
task_unchecked      = "#464b5d"  # dim
alert_note          = "#84ffff"  # accent
alert_tip           = "#c3e88d"  # 緑
alert_important     = "#c792ea"  # マゼンタ
alert_warning       = "#ffcb6b"  # 黄
alert_caution       = "#f07178"  # 赤
