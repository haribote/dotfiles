# ghostty テーマ "Material Design Colors" のパレットに合わせる。
# HEX 値は .config/nvim/colors/ghostty-material.lua の base16 パレットと同一。
base   = "ocean"
syntax = "base16-ocean.dark"

[ui]
toc_bg                      = "#2a363b"  # 明るい bg
toc_border                  = "#435b67"  # border
content_bg                  = "#1d262a"  # bg
scrollbar_hover             = "#37b6ff"  # 青
status_bg                   = "#2a363b"  # 明るい bg
status_separator            = "#a1b0b8"  # dim
status_brand_fg             = "#1d262a"  # bg
status_brand_bg             = "#37b6ff"  # 青
status_filename_fg          = "#e7ebed"  # fg
status_filename_bg          = "#4e6a78"  # selection bg
status_watch_fg             = "#5cf19e"  # 緑
status_watch_bg             = "#2a363b"  # 明るい bg
status_reloaded_fg          = "#1d262a"  # bg
status_reloaded_bg          = "#5cf19e"  # 緑
status_search_fg            = "#fed032"  # 黄
status_search_bg            = "#4e6a78"  # selection bg
status_success_fg           = "#5cf19e"  # 緑
status_success_bg           = "#2a363b"  # 明るい bg
status_warning_fg           = "#fed032"  # 黄
status_error_fg             = "#fc3841"  # 赤
status_error_bg             = "#2a363b"  # 明るい bg
status_shortcut_fg          = "#a1b0b8"  # dim
status_percent_fg           = "#37b6ff"  # 青
toc_hover_fg                = "#e7ebed"  # fg
toc_header_fg               = "#a1b0b8"  # dim
toc_active_bg               = "#4e6a78"  # selection bg
toc_inactive_bg             = "#2a363b"  # 明るい bg
toc_accent                  = "#fc669b"  # マゼンタ
toc_index_inactive          = "#435b67"  # border
toc_primary_active          = "#e7ebed"  # fg
toc_primary_inactive        = "#a1b0b8"  # dim
toc_secondary_inactive      = "#435b67"  # border
toc_secondary_text_active   = "#e7ebed"  # fg
toc_secondary_text_inactive = "#a1b0b8"  # dim

[markdown]
search_highlight_bg = "#4e6a78"  # selection bg
search_match_bg     = "#fed032"  # 黄
code_gutter         = "#435b67"  # border
blockquote_marker   = "#a1b0b8"  # dim
list_level_1        = "#5cf19e"  # 緑
list_level_2        = "#37b6ff"  # 青
list_level_3        = "#fc669b"  # マゼンタ
ordered_list        = "#fed032"  # 黄
table_border        = "#435b67"  # border
table_separator     = "#4e6a78"  # selection bg
table_header        = "#37b6ff"  # 青
table_cell          = "#e7ebed"  # fg
heading_1           = "#37b6ff"  # 青
heading_2           = "#5cf19e"  # 緑
heading_3           = "#59ffd1"  # シアン
heading_4           = "#fc669b"  # マゼンタ
heading_other       = "#fc746d"  # オレンジ
heading_underline   = "#435b67"  # border
code_frame          = "#435b67"  # border
code_label          = "#a1b0b8"  # dim
inline_code_fg      = "#59ffd1"  # シアン
inline_code_bg      = "#2a363b"  # 明るい bg
rule                = "#435b67"  # border
link_icon           = "#37b6ff"  # 青
link_text           = "#37b6ff"  # 青
link_hover          = "#59ffd1"  # シアン
blockquote_text     = "#a1b0b8"  # dim
text                = "#e7ebed"  # fg
strong_text         = "#ffffff"  # 明るい fg
latex_inline_fg     = "#fc669b"  # マゼンタ
latex_inline_bg     = "#2a363b"  # 明るい bg
latex_block_fg      = "#fc669b"  # マゼンタ
mermaid_keyword     = "#fc746d"  # オレンジ
mermaid_arrow       = "#37b6ff"  # 青
mermaid_label       = "#5cf19e"  # 緑
mermaid_block_fg    = "#e7ebed"  # fg
mark_fg             = "#1d262a"  # bg
mark_bg             = "#fed032"  # 黄
task_checked        = "#5cf19e"  # 緑
task_unchecked      = "#a1b0b8"  # dim
alert_note          = "#37b6ff"  # 青
alert_tip           = "#5cf19e"  # 緑
alert_important     = "#fc669b"  # マゼンタ
alert_warning       = "#fed032"  # 黄
alert_caution       = "#fc3841"  # 赤
