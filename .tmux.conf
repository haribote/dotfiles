# ~/.tmux.conf — tmux 3.6+

# ── 基本 ──────────────────────────────────────────────
# プレフィックスを Ctrl-a に変更（Ctrl-b より押しやすい）
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# 色とエスケープ周り（macOS / 256色 + truecolor）
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -as terminal-features ",xterm-ghostty:RGB"   # ghostty で truecolor を明示
set -sg escape-time 10        # Vim 等での ESC 遅延を解消
set -g focus-events on

# 拡張キー（CSI u）。Ctrl+Shift+t 等の Shift 付き制御キーを区別する
set -s extended-keys on
set -as terminal-features 'xterm-ghostty:extkeys'

# ウィンドウ/ペイン番号を 1 始まりにして閉じたら詰める
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# 履歴を多めに、マウス操作を有効化
set -g history-limit 50000
set -g mouse on

# 端末のクリップボードへ連携（OSC52 経由、SSH 先からのコピーも拾う）
set -g set-clipboard on

# 通知・タイトル
set -g set-titles on
set -g set-titles-string "#S:#I.#P #W"
setw -g monitor-activity on
set -g visual-activity off

# ── キーバインド ──────────────────────────────────────
# 設定をその場でリロード
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# ペイン分割を直感的に（横分割=Ctrl+T / 縦分割=Ctrl+Shift+T）。新ペインは現在のパスを引き継ぐ
bind C-t split-window -h -c "#{pane_current_path}"
bind C-S-t split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# 新規ウィンドウも現在のパスで
bind c new-window -c "#{pane_current_path}"

# ペイン番号順に移動（n=次 / p=前、末尾↔先頭で循環）
bind n select-pane -t :.+
bind p select-pane -t :.-

# ペインのリサイズ（プレフィックス後、押しっぱなしで連続調整）
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Alt+矢印 でプレフィックス無しのペイン移動
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# Shift+矢印 でプレフィックス無しのウィンドウ切替
bind -n S-Left  previous-window
bind -n S-Right next-window

# ── コピーモード（vi 風） ─────────────────────────────
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy" \; display-message "📋 クリップボードにコピーしました"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy" \; display-message "📋 クリップボードにコピーしました"

# ── 見た目（ステータスライン / Material Design Colors） ──
# 配色は ghostty テーマ "Material Design Colors" に統一
# bg #1d262a / fg #e7ebed / 青 #37b6ff / 黄 #fed032 / 赤 #fc3841 / 暗灰 #a1b0b8
set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#1d262a,fg=#e7ebed"

set -g status-left-length 40
set -g status-left "#[bg=#37b6ff,fg=#1d262a,bold] #S #[bg=#1d262a,fg=#37b6ff] "

set -g status-right-length 80
set -g status-right "#[fg=#a1b0b8] %Y-%m-%d (%a) %H:%M #[bg=#37b6ff,fg=#1d262a,bold] #h "

setw -g window-status-format "#[fg=#a1b0b8] #I:#W "
setw -g window-status-current-format "#[bg=#4e6a78,fg=#fed032,bold] #I:#W "
setw -g window-status-activity-style "fg=#fc3841"

# ペインの境界線
set -g pane-border-style "fg=#435b67"
set -g pane-active-border-style "fg=#37b6ff"

# メッセージ表示
set -g message-style "bg=#37b6ff,fg=#1d262a,bold"
